blueprint:
  name: "Deye / Sunsynk — Адаптивный ток заряда от сети по напряжению линии"
  description: >
    Автоматически регулирует ток заряда аккумулятора от сети (Modbus Reg 230 —
    Grid Charge Battery Current) на инверторах Deye / Sunsynk (через локальные
    интеграции Solarman, ESPHome или Sunsynk Add-on), отталкиваясь от порога
    отключения самого инвертора от сети (V_cutoff) и защищая EEPROM от лишних
    перезаписей.


    Все рабочие пороги автоматически рассчитываются от порога отключения инвертора (V_cutoff):

    • V_critical = V_cutoff + запас аварийного сброса (по умолчанию +8 В, напр. 185 + 8 = 193 В)

    • V_low      = V_cutoff + запас начала снижения (по умолчанию +15 В, напр. 185 + 15 = 200 В)

    • V_high     = V_low + ширина мёртвой зоны (по умолчанию +8 В, напр. 200 + 8 = 208 В)


    Алгоритм (асимметричный AIMD с мёртвой зоной):

    1. Сеть отключена (V_grid < 100 В или разомкнуто реле Grid Connected): однократно
       паркует ток на безопасном стартовом значении (10 А) для мягкого старта после включения.

    2. Батарея заряжена (SOC >= порога парковки): паркует ток на 10 А и замораживает запись.

    3. Аварийная просадка (V_grid < V_critical): мгновенно сбрасывает ток заряда до минимума (0 А).

    4. Ниже коридора (V_critical <= V_grid < V_low) или превышение лимита мощности ввода:
       пропорционально снижает ток заряда (не чаще раза в 25 сек).

    5. Безопасный коридор (V_low <= V_grid <= V_high): мёртвая зона — 0 записей в Modbus.

    6. Свободная линия (V_grid > V_high): плавно повышает ток (+5 А раз в 150 сек) до максимума.
  domain: automation
  source_url: https://github.com/ofedotov/ha-deye-adaptive-charge/blob/main/deye_adaptive_grid_charge.yaml
  input:
    inverter_device:
      name: "Устройство инвертора (необязательно)"
      description: "Выберите устройство инвертора Deye/Sunsynk в Home Assistant (опционально, для справки)."
      default:
      selector:
        device: {}

    grid_voltage_sensor:
      name: "Сенсор входного напряжения сети (Grid Voltage, В)"
      description: "Сущность напряжения сети на входе инвертора (Reg 150, например sensor.deye_grid_voltage)."
      selector:
        entity:
          domain: sensor

    charge_current_number:
      name: "Регулятор тока заряда от сети (Grid Charge Current, А)"
      description: "Сущность настройки максимального тока заряда от сети (Reg 230, например number.deye_grid_charge_battery_current)."
      selector:
        entity:
          domain: number

    inverter_cutoff_entity:
      name: "Сущность нижнего порога сети инвертора (Grid Voltage Low — опционально)"
      description: >
        Опционально: сущность уставки отключения инвертора от сети (Reg 288, number или sensor).
        Если поле пустое — используется значение ползунка ниже.
        Внимание: если в инверторе активна защита IP Protection (EN50549 отключает при ~184–185 В,
        даже когда Reg 288 = 170 В), оставьте это поле пустым и задайте реальный порог ползунком ниже.
      default:
      selector:
        entity:
          domain:
            - number
            - sensor

    inverter_cutoff_voltage:
      name: "Порог отключения инвертора от сети вручную (В)"
      description: "Реальное напряжение, ниже которого инвертор размыкает реле сети (используется, если сущность выше не выбрана; стандарт EU/EN50549 = 185 В)."
      default: 185
      selector:
        number:
          min: 150
          max: 210
          step: 1
          unit_of_measurement: "V"

    grid_connected_sensor:
      name: "Сенсор статуса реле сети (Grid Connected Status — опционально)"
      description: "Опционально: binary_sensor или sensor статуса подключения к сети (Reg 194). Позволяет мгновенно определить размыкание входного реле даже когда напряжение на входе подпрыгнуло без нагрузки."
      default:
      selector:
        entity:
          domain:
            - binary_sensor
            - sensor

    battery_soc_sensor:
      name: "Сенсор заряда батареи SOC % (рекомендуется)"
      description: "Сущность уровня заряда АКБ (Reg 184). Замораживает записи в память инвертора, когда батарея заряжена."
      default:
      selector:
        entity:
          domain: sensor

    grid_power_sensor:
      name: "Сенсор общей мощности из сети (Grid Power, Вт — опционально)"
      description: "Сущность входной мощности из сети (Reg 169 / External CT Power) для защиты от перегрузки ввода и инвертора."
      default:
      selector:
        entity:
          domain: sensor

    critical_margin_v:
      name: "Запас до аварийного сброса (+В выше порога отключения инвертора)"
      description: "V_critical = V_cutoff + этот запас (по умолчанию +8 В: при пороге 185 В мгновенный сброс в 0 А сработает ниже 193 В)."
      default: 8
      selector:
        number:
          min: 3
          max: 25
          step: 1
          unit_of_measurement: "V"

    low_margin_v:
      name: "Запас до начала снижения тока (+В выше порога отключения инвертора)"
      description: "V_low = V_cutoff + этот запас (по умолчанию +15 В: при пороге 185 В плавное снижение тока начнётся ниже 200 В)."
      default: 15
      selector:
        number:
          min: 6
          max: 35
          step: 1
          unit_of_measurement: "V"

    deadband_width_v:
      name: "Ширина безопасного коридора / мёртвой зоны (В)"
      description: "V_high = V_low + эта ширина (по умолчанию +8 В: коридор 200..208 В без единой записи в память; выше 208 В — плавный рост тока)."
      default: 8
      selector:
        number:
          min: 4
          max: 20
          step: 1
          unit_of_measurement: "V"

    min_charge_current:
      name: "Минимальный ток заряда при просадке (А)"
      description: "Нижний предел тока при сильной просадке линии (автоматически учитывает аппаратный min сущности number)."
      default: 0
      selector:
        number:
          min: 0
          max: 30
          step: 1
          unit_of_measurement: "A"

    max_charge_current:
      name: "Максимальный ток заряда при хорошей сети (А)"
      description: "Верхний предел тока заряда, когда линия свободна (не должен превышать Max Battery Charge Reg 210)."
      default: 50
      selector:
        number:
          min: 5
          max: 120
          step: 1
          unit_of_measurement: "A"

    safe_park_current:
      name: "Безопасный стартовый / парковочный ток (А)"
      description: "Выставляется однократно при 100% заряде батареи и при отключении сети для мягкого старта после подачи света."
      default: 10
      selector:
        number:
          min: 0
          max: 40
          step: 1
          unit_of_measurement: "A"

    step_up_amps:
      name: "Шаг плавного повышения тока (А)"
      description: "На сколько ампер прибавлять ток за один шаг при стабильно высоком напряжении (> V_high)."
      default: 5
      selector:
        number:
          min: 1
          max: 20
          step: 1
          unit_of_measurement: "A"

    kp_down_amps_per_volt:
      name: "Коэффициент снижения тока (А на 1 В ниже V_low)"
      description: "На сколько ампер снижать заряд на каждый 1 В просадки ниже V_low (например, 3 А/В срежет ~12 А при -4 В)."
      default: 3.0
      selector:
        number:
          min: 1.0
          max: 10.0
          step: 0.5
          unit_of_measurement: "A/V"

    ramp_up_interval_sec:
      name: "Интервал повышения тока (сек)"
      description: "Минимальная пауза между шагами повышения тока (защита от раскачки линии и износа EEPROM)."
      default: 150
      selector:
        number:
          min: 60
          max: 900
          step: 30
          unit_of_measurement: "s"

    step_down_cooldown_sec:
      name: "Пауза после снижения тока для обновления опроса Modbus (сек)"
      description: "Даёт интеграции Solarman/ESPHome (опрос 5–15 сек) увидеть новое напряжение перед следующим шагом."
      default: 25
      selector:
        number:
          min: 10
          max: 120
          step: 5
          unit_of_measurement: "s"

    max_grid_power_w:
      name: "Лимит общей входной мощности из сети (Вт, 0 = выкл)"
      description: "Если указан сенсор Grid Power, не даёт сумме (Нагрузка + Зарядка) превысить этот порог (например, 4000 Вт для 5 кВт инвертора)."
      default: 4000
      selector:
        number:
          min: 0
          max: 15000
          step: 100
          unit_of_measurement: "W"

    park_soc_pct:
      name: "Порог полного заряда SOC (%)"
      description: "Выше этого SOC регулировка замораживается на парковочном токе."
      default: 99
      selector:
        number:
          min: 85
          max: 100
          step: 1
          unit_of_measurement: "%"

    enable_logbook:
      name: "Записывать изменения в Журнал событий (Logbook)"
      description: "Логирует причину каждого изменения тока заряда в журнал Home Assistant."
      default: true
      selector:
        boolean: {}

mode: single
max_exceeded: silent
trace:
  stored_traces: 20

trigger_variables:
  _v_grid_sensor: !input grid_voltage_sensor
  _v_cut_entity: !input inverter_cutoff_entity
  _v_cut_manual: !input inverter_cutoff_voltage
  _crit_margin: !input critical_margin_v

trigger:
  - platform: template
    id: critical_voltage
    value_template: >-
      {% set vg = states(_v_grid_sensor) | float(-1) %}
      {% set has_cut_ent = _v_cut_entity is string and (_v_cut_entity | length > 0)
         and states(_v_cut_entity) not in ['unknown', 'unavailable', 'none', ''] %}
      {% set raw_cut = states(_v_cut_entity) | float(185) if has_cut_ent else (_v_cut_manual | float(185)) %}
      {% set v_cut = raw_cut * 0.1 if raw_cut > 500 else raw_cut %}
      {{ vg >= 100.0 and vg < (v_cut + (_crit_margin | float(8))) }}

  - platform: numeric_state
    id: blackout_detected
    entity_id: !input grid_voltage_sensor
    below: 100
    for:
      seconds: 10

  - platform: time_pattern
    id: periodic_tick
    seconds: "/20"

variables:
  grid_voltage_sensor: !input grid_voltage_sensor
  charge_current_number: !input charge_current_number
  inverter_cutoff_entity: !input inverter_cutoff_entity
  inverter_cutoff_voltage: !input inverter_cutoff_voltage
  grid_connected_sensor: !input grid_connected_sensor
  battery_soc_sensor: !input battery_soc_sensor
  grid_power_sensor: !input grid_power_sensor
  critical_margin_v: !input critical_margin_v
  low_margin_v: !input low_margin_v
  deadband_width_v: !input deadband_width_v
  min_charge_current: !input min_charge_current
  max_charge_current: !input max_charge_current
  safe_park_current: !input safe_park_current
  step_up_amps: !input step_up_amps
  kp_down_amps_per_volt: !input kp_down_amps_per_volt
  ramp_up_interval_sec: !input ramp_up_interval_sec
  step_down_cooldown_sec: !input step_down_cooldown_sec
  max_grid_power_w: !input max_grid_power_w
  park_soc_pct: !input park_soc_pct
  enable_logbook: !input enable_logbook

  entities_valid: >-
    {{ states(grid_voltage_sensor) not in ['unknown', 'unavailable', 'none', '']
       and states(charge_current_number) not in ['unknown', 'unavailable', 'none', ''] }}

  v_grid: "{{ states(grid_voltage_sensor) | float(-1) }}"
  cur_amps: "{{ states(charge_current_number) | float(-1) }}"

  # Определение порога отключения инвертора (из сущности Reg 288 или из ползунка)
  has_cutoff_entity: >-
    {{ inverter_cutoff_entity is string and (inverter_cutoff_entity | length > 0)
       and states(inverter_cutoff_entity) not in ['unknown', 'unavailable', 'none', ''] }}
  raw_cutoff_v: "{{ states(inverter_cutoff_entity) | float(185) if has_cutoff_entity else (inverter_cutoff_voltage | float(185)) }}"
  v_cutoff: "{{ (raw_cutoff_v | float * 0.1) if (raw_cutoff_v | float) > 500 else (raw_cutoff_v | float) }}"

  # Автоматический расчёт рабочих порогов от V_cutoff
  v_critical: "{{ (v_cutoff | float) + (critical_margin_v | float(8)) }}"
  eff_low_margin: "{{ [low_margin_v | float(15), (critical_margin_v | float(8)) + 2.0] | max }}"
  v_low: "{{ (v_cutoff | float) + (eff_low_margin | float) }}"
  v_high: "{{ (v_low | float) + (deadband_width_v | float(8)) }}"

  # Определение размыкания реле сети (по сенсору Grid Connected или по V_grid < 100 В)
  relay_known_off: >-
    {% if grid_connected_sensor is string and (grid_connected_sensor | length > 0)
          and states(grid_connected_sensor) not in ['unknown', 'unavailable', 'none', ''] %}
      {% set gs = states(grid_connected_sensor) | lower | trim %}
      {{ gs in ['off', '0', '0.0', 'false', 'disconnected', 'off-grid', 'off_grid', 'island', 'отключено'] }}
    {% else %}
      false
    {% endif %}

  hw_min: "{{ state_attr(charge_current_number, 'min') | float(0) }}"
  hw_max: "{{ state_attr(charge_current_number, 'max') | float(120) }}"
  hw_step: "{{ [state_attr(charge_current_number, 'step') | float(1), 1.0] | max }}"

  eff_min: "{{ [hw_min | float, min_charge_current | float] | max }}"
  eff_max: "{{ [hw_max | float, max_charge_current | float] | min }}"
  eff_park: "{{ [[safe_park_current | float, eff_min | float] | max, eff_max | float] | min }}"

  has_soc: >-
    {{ battery_soc_sensor is string and (battery_soc_sensor | length > 0)
       and states(battery_soc_sensor) not in ['unknown', 'unavailable', 'none', ''] }}
  soc: "{{ states(battery_soc_sensor) | float(50) if has_soc else 50.0 }}"

  has_pgrid: >-
    {{ grid_power_sensor is string and (grid_power_sensor | length > 0)
       and (max_grid_power_w | float(0)) > 0
       and states(grid_power_sensor) not in ['unknown', 'unavailable', 'none', ''] }}
  p_grid: "{{ states(grid_power_sensor) | float(0) if has_pgrid else 0.0 }}"

  sec_since_change: >-
    {% set st_obj = states[charge_current_number] %}
    {% if st_obj is defined and st_obj.last_changed is defined %}
      {{ (as_timestamp(now()) - as_timestamp(st_obj.last_changed)) | float(9999) }}
    {% else %}
      9999
    {% endif %}

  decision: >-
    {% set vg = v_grid | float %}
    {% set cur = cur_amps | float %}
    {% set vcrit = v_critical | float %}
    {% set vlow = v_low | float %}
    {% set vhigh = v_high | float %}
    {% set emin = eff_min | float %}
    {% set emax = eff_max | float %}
    {% set epark = eff_park | float %}
    {% set hstep = hw_step | float %}
    {% set sup = step_up_amps | float %}
    {% set dt = sec_since_change | float %}
    {% set watts_per_dc_amp = 58.0 %}

    {% if not entities_valid or vg < 0 or cur < 0 %}
      {{ {'write': false, 'target': cur, 'reason': 'entities_unavailable'} | to_json }}

    {% elif vg < 100.0 or (relay_known_off | bool(false)) %}
      {% set tgt = (epark / hstep) | round(0) * hstep %}
      {% set tgt = [[tgt, emin] | max, emax] | min %}
      {{ {'write': (tgt - cur) | abs >= hstep, 'target': tgt,
          'reason': 'Сеть отключена (V=' ~ (vg | round(1)) ~ ' В) -> парковка на стартовом токе ' ~ (tgt | round(0) | int) ~ ' А'} | to_json }}

    {% elif has_soc and (soc | float) >= (park_soc_pct | float) %}
      {% set tgt = (epark / hstep) | round(0) * hstep %}
      {% set tgt = [[tgt, emin] | max, emax] | min %}
      {{ {'write': (tgt - cur) | abs >= hstep, 'target': tgt,
          'reason': 'АКБ заряжена (SOC ' ~ (soc | round(0) | int) ~ '%) -> парковка на ' ~ (tgt | round(0) | int) ~ ' А'} | to_json }}

    {% elif vg < vcrit %}
      {% set tgt = emin %}
      {{ {'write': (tgt - cur) | abs >= hstep, 'target': tgt,
          'reason': 'АВАРИЙНАЯ ПРОСАДКА (' ~ (vg | round(1)) ~ ' В < ' ~ (vcrit | round(0) | int) ~ ' В) -> сброс до ' ~ (tgt | round(0) | int) ~ ' А'} | to_json }}

    {% elif vg < vlow or (has_pgrid and (p_grid | float) > (max_grid_power_w | float)) %}
      {% if dt < (step_down_cooldown_sec | float) %}
        {{ {'write': false, 'target': cur, 'reason': 'cooldown_down'} | to_json }}
      {% else %}
        {% set drop_v = (vlow - vg) * (kp_down_amps_per_volt | float) if vg < vlow else 0.0 %}
        {% set drop_p = ((p_grid | float) - (max_grid_power_w | float)) / watts_per_dc_amp if (has_pgrid and (p_grid | float) > (max_grid_power_w | float)) else 0.0 %}
        {% set raw_drop = [drop_v, drop_p, sup] | max %}
        {% set q_drop = ((raw_drop / hstep) | round(0, 'ceil')) * hstep %}
        {% set tgt = [[cur - q_drop, emin] | max, emax] | min %}
        {{ {'write': (cur - tgt) >= hstep, 'target': tgt,
            'reason': 'Снижение нагрузки на сеть (V=' ~ (vg | round(1)) ~ ' В < ' ~ (vlow | round(0) | int) ~ ' В, P=' ~ (p_grid | round(0) | int) ~ ' Вт) -> ' ~ (cur | round(0) | int) ~ ' А -> ' ~ (tgt | round(0) | int) ~ ' А'} | to_json }}
      {% endif %}

    {% elif vg > vhigh %}
      {% if dt < (ramp_up_interval_sec | float) %}
        {{ {'write': false, 'target': cur, 'reason': 'cooldown_up'} | to_json }}
      {% elif has_pgrid and ((p_grid | float) + sup * watts_per_dc_amp) > (max_grid_power_w | float) %}
        {{ {'write': false, 'target': cur, 'reason': 'power_cap_reached'} | to_json }}
      {% else %}
        {% set tgt = [[((cur + sup) / hstep) | round(0) * hstep, emin] | max, emax] | min %}
        {{ {'write': (tgt - cur) >= hstep, 'target': tgt,
            'reason': 'Сеть стабильна (' ~ (vg | round(1)) ~ ' В > ' ~ (vhigh | round(0) | int) ~ ' В) -> плавный рост ' ~ (cur | round(0) | int) ~ ' А -> ' ~ (tgt | round(0) | int) ~ ' А'} | to_json }}
      {% endif %}

    {% else %}
      {{ {'write': false, 'target': cur, 'reason': 'deadband'} | to_json }}
    {% endif %}

  parsed_decision: "{{ decision | from_json if decision is string else decision }}"
  should_write: "{{ parsed_decision.write | bool(false) }}"
  target_amps: "{{ parsed_decision.target | float(0) }}"
  change_reason: "{{ parsed_decision.reason | string }}"

condition:
  - condition: template
    value_template: "{{ should_write }}"

action:
  - service: number.set_value
    target:
      entity_id: !input charge_current_number
    data:
      value: "{{ target_amps }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ enable_logbook | bool(true) }}"
        sequence:
          - service: logbook.log
            data:
              name: "Deye Adaptive Charge"
              message: "{{ change_reason }}"
              entity_id: !input charge_current_number
